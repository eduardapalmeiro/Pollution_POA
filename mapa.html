<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>POAluição - Mapa</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

  <div id="BigCaixa">
    <h1 class="title">Poluição em POA</h1>

    <div id="CaixaPrincipal">
      <div id="conteudo-caixa-mapa">
      <h2>Mapa de Focos e Ecopontos</h2>
 
      <div class="mapa-legenda">
        <span><span class="mapa-legenda-dot" style="background:#8b134f"></span>Esgoto a céu aberto</span>
        <span><span class="mapa-legenda-dot" style="background:#247e81"></span>Descarte irregular</span>
        <span><span class="mapa-legenda-dot" style="background:#9c9e1f"></span>Poluição do ar</span>
      </div>
 
      
      <div class="mapa-container">
        <div id="map"></div>
      </div>
 
      <h3 class="titulos-mapa">Focos Reportados:</h3>
      <div id="listaFocos" style="margin-top: 1px; margin-bottom: 1px;"></div>
 
      <h3 class="titulos-mapa">Ecopontos Fixos em POA</h3>
      <ul style="margin-top: 1px;">
        <li><strong>Ecoponto Centro:</strong> Descarte de Eletrônicos</li>
        <li><strong>Ecoponto Humaitá:</strong> Entulhos e Móveis</li>
        <li><strong>Ecoponto Restinga:</strong> Lixo Orgânico e Reciclável</li>
      </ul>
      </div>
    </div>

    <div id="Cabecalho">
      <a href="index.html"><button class="BotaoInicial">Inicio</button></a>
      <a href="mapa.html"><button class="BotaoInicial">Mapa</button></a>
      <a href="denuncias.html"><button class="BotaoInicial">Denuncias</button></a>
    </div>

  </div>
  <img id="garota" src="src/menina.png" style="pointer-events: none;">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="denuncias-mapa.js"></script>
  <script>
  const map = L.map('map').setView([-30.0500, -51.1900], 12);
 
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>'
}).addTo(map);
 
  window.mapaLeaflet = map;
 
  const ecopontos = [
    { nome: "Ecoponto Centro",   lat: -30.0277, lng: -51.2287, desc: "Descarte de Eletrônicos" },
    { nome: "Ecoponto Humaitá",  lat: -30.0039, lng: -51.2217, desc: "Entulhos e Móveis"       },
    { nome: "Ecoponto Restinga", lat: -30.1519, lng: -51.1400, desc: "Lixo Orgânico e Reciclável" },
  ];
 
  const iconEcoponto = L.divIcon({
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
      <path d="M14 0C6.27 0 0 6.27 0 14c0 9.63 14 22 14 22S28 23.63 28 14C28 6.27 21.73 0 14 0z"
        fill="#2E7D32" stroke="#fff" stroke-width="1.5"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif">♻</text>
    </svg>`,
    className: '',
    iconSize:   [28, 36],
    iconAnchor: [14, 36],
    popupAnchor:[0, -38],
  });
 
  ecopontos.forEach(ep => {
    L.marker([ep.lat, ep.lng], { icon: iconEcoponto })
      .bindTooltip(`<b>${ep.nome}</b><br>${ep.desc}`, { direction: 'top' })
      .addTo(map);
  });
 
  document.addEventListener('DOMContentLoaded', () => {
    renderizarDenunciasNoMapa(map);
  });
</script>
  <script src="scripts.js"></script>
</body>
</html>
